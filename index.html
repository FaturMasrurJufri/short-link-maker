<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Link Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated Background Particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 60% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 80% 10%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.15), transparent),
                radial-gradient(2px 2px at 70% 60%, rgba(255,255,255,0.1), transparent),
                radial-gradient(2px 2px at 90% 90%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 50% 50%, rgba(255,255,255,0.15), transparent);
            z-index: 0;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 10px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            letter-spacing: -0.5px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        /* Developer Identity */
        .developer-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 30px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            animation: blink 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3);
            flex-shrink: 0;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3);
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                box-shadow: 0 0 3px rgba(0, 255, 136, 0.2), 0 0 8px rgba(0, 255, 136, 0.1);
                transform: scale(0.85);
            }
        }

        .developer-info span {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .developer-info strong {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group label .required {
            color: #f093fb;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
            z-index: 2;
            transition: opacity 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .form-group input:focus ~ .input-icon,
        .form-group input:focus + .input-icon {
            opacity: 1;
        }

        .input-wrapper:focus-within .input-icon {
            opacity: 1;
        }

        /* Custom name preview */
        .name-preview {
            margin-top: 8px;
            padding: 8px 14px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            display: none;
            word-break: break-all;
        }

        .name-preview.active {
            display: block;
        }

        .name-preview span {
            color: #667eea;
            font-weight: 600;
        }

        /* Button */
        .btn-generate {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .btn-generate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-generate:hover::before {
            left: 100%;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .btn-generate.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-generate.loading .spinner {
            display: block;
        }

        .btn-generate.loading .btn-text {
            display: none;
        }

        .btn-generate.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result Area */
        .result-area {
            margin-top: 25px;
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        .result-area.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            margin-bottom: 25px;
        }

        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .result-box {
            display: flex;
            align-items: center;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 14px;
            padding: 5px;
            gap: 5px;
        }

        .result-link {
            flex: 1;
            padding: 12px 16px;
            color: #00ff88;
            font-size: 14px;
            font-weight: 500;
            word-break: break-all;
            line-height: 1.5;
        }

        .btn-copy {
            padding: 12px 20px;
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 10px;
            color: #00ff88;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background: rgba(0, 255, 136, 0.25);
            transform: scale(1.02);
        }

        .btn-copy.copied {
            background: rgba(0, 255, 136, 0.3);
            color: #fff;
        }

        /* Link Info */
        .link-info {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .info-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-tag .tag-icon {
            font-size: 14px;
        }

        /* History Section */
        .history-section {
            margin-top: 25px;
            display: none;
        }

        .history-section.active {
            display: block;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .btn-clear-history {
            background: none;
            border: 1px solid rgba(255, 100, 100, 0.2);
            color: rgba(255, 100, 100, 0.6);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-clear-history:hover {
            background: rgba(255, 100, 100, 0.1);
            color: rgba(255, 100, 100, 0.9);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 4px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: all 0.3s;
            gap: 10px;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .history-item-info {
            flex: 1;
            min-width: 0;
        }

        .history-item-name {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-link {
            font-size: 11px;
            color: #667eea;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-item-copy {
            background: rgba(102, 126, 234, 0.1);
            border: none;
            color: #667eea;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .history-item-copy:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: rgba(0, 255, 136, 0.3);
        }

        .toast.error {
            border-color: rgba(255, 100, 100, 0.3);
        }

        /* Error state */
        .form-group input.error {
            border-color: rgba(255, 100, 100, 0.5);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-message {
            color: rgba(255, 100, 100, 0.8);
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .result-box {
                flex-direction: column;
            }

            .btn-copy {
                width: 100%;
                justify-content: center;
            }

            .stats-bar {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Header -->
            <div class="header">
                <div class="header-icon">🔗</div>
                <h1>Short Link Generator</h1>
            </div>

            <!-- Developer Identity -->
            <div class="developer-info">
                <div class="status-dot"></div>
                <span>developer: <strong>fatur62</strong></span>
            </div>

            <!-- Form -->
            <div class="form-group">
                <label>📝 Nama Link <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">🏷️</span>
                    <input 
                        type="text" 
                        id="linkName" 
                        placeholder="Contoh: promo-ramadhan, link-portofolio..."
                        maxlength="50"
                    >
                </div>
                <div class="name-preview" id="namePreview">
                    Akan menjadi: <span id="previewText"></span>
                </div>
                <div class="error-message" id="nameError">⚠️ Silakan masukkan nama link terlebih dahulu</div>
            </div>

            <div class="form-group">
                <label>🌐 URL Tujuan <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">🔗</span>
                    <input 
                        type="url" 
                        id="longUrl" 
                        placeholder="https://contoh.com/halaman-yang-panjang..."
                    >
                </div>
                <div class="error-message" id="urlError">⚠️ Silakan masukkan URL yang valid</div>
            </div>

            <!-- Generate Button -->
            <button class="btn-generate" id="btnGenerate" onclick="generateShortLink()">
                <span class="btn-icon">⚡</span>
                <span class="btn-text">Buat Short Link</span>
                <div class="spinner"></div>
            </button>

            <!-- Result -->
            <div class="result-area" id="resultArea">
                <div class="result-divider"></div>
                <div class="result-label">✅ Short link berhasil dibuat</div>
                <div class="result-box">
                    <div class="result-link" id="resultLink"></div>
                    <button class="btn-copy" id="btnCopy" onclick="copyLink()">
                        <span id="copyIcon">📋</span>
                        <span id="copyText">Salin</span>
                    </button>
                </div>
                <div class="link-info">
                    <div class="info-tag">
                        <span class="tag-icon">🏷️</span>
                        <span id="infoName">-</span>
                    </div>
                    <div class="info-tag">
                        <span class="tag-icon">📅</span>
                        <span id="infoDate">-</span>
                    </div>
                </div>
            </div>

            <!-- History -->
            <div class="history-section" id="historySection">
                <div class="result-divider"></div>
                <div class="history-header">
                    <span class="history-title">📚 Riwayat Link</span>
                    <button class="btn-clear-history" onclick="clearHistory()">🗑️ Hapus Semua</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>

            <!-- Stats -->
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="totalLinks">0</div>
                    <div class="stat-label">Links Dibuat</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="todayLinks">0</div>
                    <div class="stat-label">Hari Ini</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">Berhasil!</span>
    </div>

    <script>
        // Storage for history
        let linkHistory = JSON.parse(localStorage.getItem('linkHistory') || '[]');
        let totalCreated = parseInt(localStorage.getItem('totalCreated') || '0');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            renderHistory();
            
            // Live preview for link name
            document.getElementById('linkName').addEventListener('input', function() {
                const preview = document.getElementById('namePreview');
                const previewText = document.getElementById('previewText');
                const value = this.value.trim();
                
                if (value) {
                    const slug = slugify(value);
                    previewText.textContent = `short.link/${slug}`;
                    preview.classList.add('active');
                } else {
                    preview.classList.remove('active');
                }

                // Remove error state on input
                this.classList.remove('error');
                document.getElementById('nameError').classList.remove('active');
            });

            document.getElementById('longUrl').addEventListener('input', function() {
                this.classList.remove('error');
                document.getElementById('urlError').classList.remove('active');
            });
        });

        function slugify(text) {
            return text
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .trim();
        }

        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateShortLink() {
            const nameInput = document.getElementById('linkName');
            const urlInput = document.getElementById('longUrl');
            const name = nameInput.value.trim();
            const url = urlInput.value.trim();
            let hasError = false;

            // Validate name
            if (!name) {
                nameInput.classList.add('error');
                document.getElementById('nameError').classList.add('active');
                hasError = true;
            }

            // Validate URL
            if (!url) {
                urlInput.classList.add('error');
                document.getElementById('urlError').textContent = '⚠️ Silakan masukkan URL terlebih dahulu';
                document.getElementById('urlError').classList.add('active');
                hasError = true;
            } else if (!isValidUrl(url)) {
                urlInput.classList.add('error');
                document.getElementById('urlError').textContent = '⚠️ Format URL tidak valid. Contoh: https://contoh.com';
                document.getElementById('urlError').classList.add('active');
                hasError = true;
            }

            if (hasError) return;

            // Show loading
            const btn = document.getElementById('btnGenerate');
            btn.classList.add('loading');

            // Simulate API call
            setTimeout(() => {
                const slug = slugify(name) || generateRandomString(6);
                const shortLink = `short.link/${slug}-${generateRandomString(4)}`;

                // Show result
                document.getElementById('resultLink').textContent = shortLink;
                document.getElementById('infoName').textContent = name;
                document.getElementById('infoDate').textContent = getCurrentDate();
                document.getElementById('resultArea').classList.add('active');

                // Save to history
                const historyItem = {
                    name: name,
                    shortLink: shortLink,
                    originalUrl: url,
                    date: new Date().toISOString(),
                    displayDate: getCurrentDate()
                };

                linkHistory.unshift(historyItem);
                if (linkHistory.length > 20) linkHistory.pop(); // Keep max 20 items
                localStorage.setItem('linkHistory', JSON.stringify(linkHistory));

                totalCreated++;
                localStorage.setItem('totalCreated', totalCreated.toString());

                // Update UI
                updateStats();
                renderHistory();

                // Reset button
                btn.classList.remove('loading');

                // Show toast
                showToast('✅', 'Short link berhasil dibuat!', 'success');

                // Reset form
                nameInput.value = '';
                urlInput.value = '';
                document.getElementById('namePreview').classList.remove('active');

            }, 1500);
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        function getCurrentDate() {
            const now = new Date();
            const options = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            return now.toLocaleDateString('id-ID', options);
        }

        function copyLink() {
            const link = document.getElementById('resultLink').textContent;
            copyToClipboard(link);

            const btn = document.getElementById('btnCopy');
            const icon = document.getElementById('copyIcon');
            const text = document.getElementById('copyText');

            btn.classList.add('copied');
            icon.textContent = '✅';
            text.textContent = 'Tersalin!';

            showToast('📋', 'Link berhasil disalin ke clipboard!', 'success');

            setTimeout(() => {
                btn.classList.remove('copied');
                icon.textContent = '📋';
                text.textContent = 'Salin';
            }, 2000);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
        }

        function copyHistoryLink(link) {
            copyToClipboard(link);
            showToast('📋', 'Link berhasil disalin!', 'success');
        }

        function renderHistory() {
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            if (linkHistory.length === 0) {
                historySection.classList.remove('active');
                return;
            }

            historySection.classList.add('active');
            historyList.innerHTML = linkHistory.map((item, index) => `
                <div class="history-item" style="animation: fadeInUp 0.3s ease ${index * 0.05}s both;">
                    <div class="history-item-info">
                        <div class="history-item-name">${escapeHtml(item.name)}</div>
                        <div class="history-item-link">${escapeHtml(item.shortLink)}</div>
                    </div>
                    <button class="history-item-copy" onclick="copyHistoryLink('${escapeHtml(item.shortLink)}')" title="Salin link">📋</button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearHistory() {
            if (confirm('Hapus semua riwayat link?')) {
                linkHistory = [];
                localStorage.setItem('linkHistory', '[]');
                renderHistory();
                showToast('🗑️', 'Riwayat berhasil dihapus', 'success');
            }
        }

        function updateStats() {
            document.getElementById('totalLinks').textContent = totalCreated;

            // Count today's links
            const today = new Date().toDateString();
            const todayCount = linkHistory.filter(item => 
                new Date(item.date).toDateString() === today
            ).length;
            document.getElementById('todayLinks').textContent = todayCount;
        }

        function showToast(icon, message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastIcon').textContent = icon;
            document.getElementById('toastMessage').textContent = message;
            
            toast.className = `toast ${type}`;
            
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
